publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  flutter_rust_bridge: ^2.3.0
  cryptography: ^2.7.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  file_picker: ^13.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
